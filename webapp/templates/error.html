<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Civ Historian - error</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .status { background: #fdecea; color: #611a15; padding: 0.6rem 0.9rem; border-radius: 4px; margin: 1rem 0; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 0.75rem; border-radius: 4px; }
  a.back { display: inline-block; margin-top: 2rem; }
</style>
</head>
<body>
  <h1>{% if session_name %}Session: {{ session_name }}{% else %}Upload failed{% endif %}</h1>
  <div class="status">The pipeline run failed.</div>
  <pre>{{ message }}</pre>
  <a class="back" href="/">&laquo; Try again</a>
</body>
</html>
