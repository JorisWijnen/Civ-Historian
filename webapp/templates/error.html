<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civ Historian - error</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <div class="crest">
    <h1>Civ Historian</h1>
    <div class="rule"><span>&#9670;</span></div>
    <p class="subtitle">{% if session_name %}{{ session_name }}{% else %}Upload failed{% endif %}</p>
  </div>

  <div class="ribbon fail">The pipeline run failed</div>

  <div class="panel">
    <h2>Details</h2>
    <pre class="error-detail">{{ message }}</pre>
  </div>

  <a class="link-back" href="/">&laquo; Try again</a>
</div>
</body>
</html>
