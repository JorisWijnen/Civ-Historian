services:
  webapp:
      build: .
      ports:
        - "8006:8000"
      volumes:
        - /root/civ-historian/sessions:/app/sessions
        - /root/civ-historian/data:/app/data
        - /root/.claude:/app/.claude
        - /root/.claude.json:/app/.claude.json
      user: "100000:100000"
      env_file:
        - ./.env
      restart: unless-stopped
